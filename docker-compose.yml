services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmind}
      POSTGRES_DB: ${POSTGRES_DB:-stockmind}
    ports:
      - "5432:5432"
    volumes:
      - stockmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmind} -d ${POSTGRES_DB:-stockmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stockmind}:${POSTGRES_PASSWORD:-stockmind}@db:5432/${POSTGRES_DB:-stockmind}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      SECRET_KEY: ${SECRET_KEY:-stockmind-demo-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SQL_ECHO: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Migrate, seed (idempotent), then serve.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  stockmind_pgdata:
